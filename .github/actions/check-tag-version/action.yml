name: Check tag version
description: Fail unless the pushed `v*` tag matches the workspace version in Cargo.toml.

runs:
  using: composite
  steps:
    - name: Verify version matches tag
      shell: bash
      run: |
        TAG_VERSION="${GITHUB_REF#refs/tags/v}"
        CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 \
          | jq -r '.packages[] | select(.name == "usfm3") | .version')
        if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
          echo "::error::Tag version ($TAG_VERSION) does not match workspace version ($CARGO_VERSION)"
          exit 1
        fi
