[package]
name = "usfm3-python"
version = "0.2.0"
edition = "2024"

[lib]
name = "usfm3"
crate-type = ["cdylib"]

[dependencies]
usfm3 = { workspace = true }
pyo3 = { version = "0.23", features = ["extension-module"] }
serde = { workspace = true }
serde_json = { workspace = true }
pythonize = "0.23"
