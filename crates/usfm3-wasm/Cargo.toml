[package]
name = "usfm3-wasm"
description = "Error-tolerant, blazingly fast USFM 3.x parser — USJ, USX, USFM, CST, and vref for the browser and Node (WebAssembly)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["usfm", "usj", "usx", "vref", "bible"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
usfm3 = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
# Zero-dependency (macro_rules) self-referential cell: lets one handle own the
# source String and the borrowing `Document` together, so we parse once and serve
# every view without re-parsing or unsafe lifetime tricks.
self_cell = "1"
