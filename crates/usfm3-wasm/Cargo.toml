[package]
name = "usfm3-wasm"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Error-tolerant USFM 3.x parser with USJ, USX, and USFM output"
readme = "README.md"
repository = "https://github.com/jcuenod/usfm3"
keywords = ['usfm', 'usj', 'usx', 'vref', 'parser', 'bible', 'scripture']

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
usfm3 = { workspace = true }
wasm-bindgen = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"
tsify-next = { version = "0.5", default-features = false, features = ["js"] }
