[package]
name = "usfm3"
description = "Error-tolerant, blazingly fast USFM parser with a flat tape IR"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["usfm", "usj", "usx", "bible", "parser"]
categories = ["parser-implementations", "text-processing"]

[dependencies]
# SIMD-accelerated, stable-Rust scanning for the structural (stage 1) pass.
memchr = "2"

[build-dependencies]
toml = "0.8"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
roxmltree = "0.20"
serde_json = "1"
