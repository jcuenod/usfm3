# USFM marker specification — the single source of truth for the parser.
#
# `build.rs` reads this and generates per-version `MarkerTable`s (with a phf
# perfect-hash name->id map) into $OUT_DIR/marker_tables.rs.
#
# Each [groups.<id>] entry shares one profile across many marker `names`:
#   category : identification | chapter | verse | paragraph | character | note | milestone | other  (required)
#   role     : content | excluded | boundary   (vref TextRole; default by category)
#   closing  : none | optional | required       (default by category)
#   usx      : USX element name                 (default by category)
#   since    : first USFM version ("3.0" default); until : last version (optional)
#
# Version deltas: set `since`/`until` per group. Until the exact 3.1↔3.2
# additions are verified, everything is "3.0" (present in both tables); the
# filtering machinery is wired and ready for real deltas.
#
# Defaults by category:
#   role:    character->content, note->excluded, paragraph->boundary,
#            identification->excluded, chapter/verse->boundary, milestone->excluded
#   usx:     paragraph/identification->para, character->char, note->note,
#            chapter->chapter, verse->verse, milestone->ms

# --- identification / headers (not verse text) -----------------------------
[groups.id]
category = "identification"
usx = "book"
names = ["id"]

[groups.ident]
category = "identification"
# \h1-3, \toc1-3, \toca1-3 resolve to h/toc/toca via the lookup fallback.
names = ["usfm", "ide", "sts", "h", "toc", "toca"]

# \rem (remark) is identification-like, but when it appears inside a body
# paragraph it NESTS as a child remark rather than ending the paragraph, and is
# itself closed by the next verse/block. The `usx` name lets the parser spot it.
[groups.rem]
category = "identification"
usx = "rem"
names = ["rem"]

# --- introductions (excluded from verse text) ------------------------------
[groups.intro_para]
category = "paragraph"
role = "excluded"
# Numeric levels (\imt2, \io3, …) resolve to the base via the lookup fallback.
names = ["imt", "imte", "is", "ip", "ipi", "im", "imi", "ipq", "imq", "ipr",
         "iq", "ib", "ili", "iot", "io", "iex", "ie"]

[groups.intro_char]
category = "character"
role = "excluded"
names = ["ior", "iqt"]

# --- titles / section headings / references (excluded from verse text) ------
[groups.titles]
category = "paragraph"
role = "excluded"
# Numeric levels (\mt2, \s3, …) resolve to the base via the lookup fallback.
names = ["mt", "mte", "ms", "mr", "s", "sr", "r", "sp", "sd", "d", "qa", "cl", "cd"]

# --- chapter / verse --------------------------------------------------------
[groups.chapter]
category = "chapter"
names = ["c"]

[groups.verse]
category = "verse"
names = ["v"]

# Alternate/published chapter & verse numbers. They MAY be closed (`\ca 2\ca*`)
# but need not be (`\cp M` runs to the next block), so closing is `none` — they
# fold into the chapter/verse object during serialization either way.
[groups.alt_numbering]
category = "character"
role = "excluded"
closing = "none"
names = ["ca", "va", "vp", "cp"]

# --- verse-bearing paragraphs (their text IS verse content) -----------------
[groups.para_text]
category = "paragraph"
role = "boundary"
# Numeric levels (\q1, \pi2, \li3, …) resolve to the base via the lookup fallback.
names = ["p", "m", "po", "pr", "cls", "pmo", "pm", "pmc", "pmr",
         "pi", "mi", "nb", "pc", "ph", "b", "pb", "q", "qr", "qc", "qm", "qd",
         "lh", "li", "lf", "lim", "lit", "tr"]

# --- character markers (drop tag, keep inner text) --------------------------
# \addpn (added proper name) is deprecated as of USFM 3.0 in favour of a nested
# \pn inside \add; it still parses as a character marker but carries an advisory.
[groups.deprecated_char]
category = "character"
role = "content"
deprecated_since = "3.0"
deprecated_for = 'nested \pn …\pn* within \add …\add*'
names = ["addpn"]

[groups.char_text]
category = "character"
role = "content"
names = ["add", "bk", "dc", "k", "nd", "ndx", "ord",
         "pn", "png", "pro", "qac", "qs", "qt", "sig", "sls", "tl", "wj",
         "em", "bd", "bdit", "it", "no", "sc", "sup", "w", "wa", "wg", "wh",
         "lik", "liv", "jmp", "rb",
         # closed note-internal markers (nest inside a note, unlike fr/ft/fq)
         "fv", "fm", "cat", "ref", "litl"]

# Dual-mode link/cross-reference char (\xt). Per the spec it is a closed
# character marker (`\xt …\xt*`) that NESTS — but when written without a close it
# behaves as a note-text element (a sibling of \xo/\ft). The parser resolves which
# by looking ahead for a matching `\xt*` before the enclosing note/block closes.
[groups.link_char]
category = "character"
role = "content"
closing = "optional"
names = ["xt"]

# Sidebars and peripheral matter are BLOCK CONTAINERS: they wrap the paragraphs
# that follow (until \esbe / the next \periph / a higher boundary) rather than
# ending at the next block like an ordinary paragraph. The `usx` element name is
# how the parser and serializers recognise them.
[groups.sidebar]
category = "paragraph"
role = "excluded"
usx = "sidebar"
names = ["esb"]

[groups.sidebar_end]
category = "paragraph"
role = "excluded"
usx = "sidebar-end"
names = ["esbe"]

[groups.periph]
category = "identification"
role = "excluded"
usx = "periph"
names = ["periph"]

# Cross-reference-quote: present in text flow but excluded from verse text.
[groups.char_excluded]
category = "character"
role = "excluded"
names = ["rq"]

# Table cells carry content text.
[groups.table_cells]
category = "character"
role = "content"
closing = "none"
usx = "cell"
# Column numbers and spans (\tc3, \tcr1-2, …) resolve to the base via the
# lookup fallback — no need to enumerate every column/range.
names = ["th", "thr", "thc", "tc", "tcr", "tcc"]

# --- notes & figures (whole subtree excluded from verse text) ---------------
[groups.notes]
category = "note"
names = ["f", "fe", "ef", "x", "ex"]

# Figures are inline, paired, take attributes, and are excluded from verse text.
[groups.figure]
category = "character"
role = "excluded"
closing = "required"
usx = "figure"
names = ["fig"]

# Note-internal markers: live inside an excluded note subtree, so role is moot;
# listed so they parse cleanly rather than warning as unknown.
[groups.note_content]
category = "character"
role = "content"
closing = "none"
names = ["fr", "fk", "fq", "fqa", "fl", "fw", "fp", "ft", "fdc",
         "xo", "xk", "xq", "xta", "xop", "xot", "xnt", "xdc"]

# --- milestones (self-closing via `\*`) -------------------------------------
[groups.milestones]
category = "milestone"
closing = "none"
names = ["qt-s", "qt-e", "qt1-s", "qt1-e", "qt2-s", "qt2-e", "ts-s", "ts-e", "ts",
         "zaln-s", "zaln-e", "zms", "k-s", "k-e"]
